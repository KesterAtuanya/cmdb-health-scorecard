[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdb-health-scorecard"
version = "1.0.0"
description = "Score the health of a ServiceNow CMDB and list exactly what to fix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kester Atuanya" }]
dependencies = ["requests>=2.31"]
keywords = ["servicenow", "cmdb", "itsm", "data-quality"]

[project.scripts]
cmdb-health = "cmdb_health.cli:main"

[tool.setuptools.packages.find]
include = ["cmdb_health*"]
